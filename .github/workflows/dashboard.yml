name: Tableau de bord

# Regenerates assets/generated/stats.svg and the « Activité récente » section of the README.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/dashboard.yml'

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh stats and activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional personal token (read:user) so private contributions are counted too.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/update_dashboard.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated
          if git diff --cached --quiet; then
            echo "Rien à mettre à jour"
          else
            git commit -m "⚓ Mise à jour du tableau de bord"
            # main may have moved while we were running: rebase and retry.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              sleep $((attempt * 5))
            done
            exit 1
          fi
