<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="120" viewBox="0 0 800 120" preserveAspectRatio="xMidYMid meet">
  <rect width="100%" height="100%" fill="#120318"/>

  <defs>
    <mask id="reveal">
      <rect x="0" y="0" width="0" height="120" fill="#fff">
        <animate attributeName="width"
                 dur="4s"
                 values="0;280;280;0"
                 keyTimes="0;0.55;0.8;1"
                 calcMode="linear"
                 repeatCount="indefinite" />
      </rect>
    </mask>

    <g id="cursor">
      <rect x="0" y="28" width="6" height="48" fill="#D9B8FF">
        <animate attributeName="opacity"
                 values="1;0;1"
                 dur="1s"
                 repeatCount="indefinite" />
      </rect>
    </g>
  </defs>

  <style>
    .name {
      font-family: 'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 56px;
      fill: #F8F4FF;
      letter-spacing: 1px;
    }
    .subtle {
      fill: #CDB7FF;
      font-size: 14px;
      font-weight: 500;
    }
  </style>

  <text x="30" y="30" class="subtle">NotSayk — Développeur / Étudiant</text>

  <g mask="url(#reveal)">
    <text x="30" y="82" class="name">NotSayk</text>
  </g>

  <g>
    <rect id="cursorRect" x="30" y="28" width="6" height="48" fill="#D9B8FF">
      <animate attributeName="x"
               dur="4s"
               values="30;310;310;30"
               keyTimes="0;0.55;0.8;1"
               calcMode="linear"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="1;0;1"
               dur="1s"
               repeatCount="indefinite"
               begin="0s"/>
    </rect>
  </g>

  <ellipse cx="200" cy="96" rx="160" ry="6" fill="#2a1138" opacity="0.25"/>
</svg>
